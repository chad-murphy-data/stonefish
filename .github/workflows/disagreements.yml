name: Maia Disagreement Analysis

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      games_per_preset:
        description: "Number of self-play games per elo preset"
        default: "2"
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run disagreement analysis
        run: |
          GAMES="${{ github.event.inputs.games_per_preset || '2' }}"
          python analyze_disagreements.py "$GAMES" 2>&1 | tee disagreement_report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disagreement-report
          path: disagreement_report.txt
