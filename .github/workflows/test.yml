name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify Stockfish
        run: |
          which stockfish
          stockfish <<< "uci" | head -5

      - name: Run tests (2 self-play games)
        run: python test_stonefish.py 2
